services:
  db_core:
    image: postgis/postgis:17-3.5-alpine
    container_name: attilan_db_core
    restart: unless-stopped
    networks:
      attilan_net:
        aliases:
          - db_core
          - db-core
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:?set DB_BOOTSTRAP_USER in .env}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?set DB_BOOTSTRAP_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      API_WORKER_PASSWORD: ${API_WORKER_PASSWORD:?set API_WORKER_PASSWORD in .env}
      AUDIT_REPLICA_PASSWORD: ${AUDIT_REPLICA_PASSWORD:?set AUDIT_REPLICA_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_stage1.sql:/docker-entrypoint-initdb.d/01_schema_stage1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio_worm:
    # Self-provisioning: entrypoint wrapper starts server, configures local
    # WORM bucket + API user via built-in mc, then hands off to server.
    image: cgr.dev/chainguard/minio:latest
    container_name: attilan_minio_worm
    restart: unless-stopped
    networks:
      attilan_net:
        aliases:
          - minio-worm
          - minio_worm
    entrypoint: ["/usr/bin/sh", "/minio-entrypoint.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:?set MINIO_EVIDENCE_BUCKET in .env}
      MINIO_API_USER: ${MINIO_API_USER:-attilan_api}
      MINIO_API_PASSWORD: ${MINIO_API_PASSWORD:?set MINIO_API_PASSWORD in .env}
    volumes:
      - minio_data:/data
      - ./minio/minio-entrypoint.sh:/minio-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  minio_setup:
    # Thin sentinel: waits for minio_worm to become healthy, then exits 0.
    image: cgr.dev/chainguard/minio:latest
    container_name: attilan_minio_setup
    restart: "no"
    networks:
      - attilan_net
    depends_on:
      minio_worm:
        condition: service_healthy
    entrypoint: ["/usr/bin/sh", "-c", "echo 'MinIO WORM ready and provisioned.'; exit 0"]

  fastapi_engine:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attilan_fastapi_engine
    restart: unless-stopped
    networks:
      attilan_net:
        aliases:
          - fastapi_engine
          - fastapi-engine
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db_core:
        condition: service_healthy
      minio_setup:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://api_worker_login:${API_WORKER_PASSWORD:?set API_WORKER_PASSWORD in .env}@db_core:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      MINIO_ENDPOINT: minio-worm:9000
      MINIO_ACCESS_KEY: ${MINIO_API_USER:-attilan_api}
      MINIO_SECRET_KEY: ${MINIO_API_PASSWORD:?set MINIO_API_PASSWORD in .env}
      MINIO_SECURE: "false"
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:?set MINIO_EVIDENCE_BUCKET in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  hash_broadcaster:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attilan_hash_broadcaster
    restart: unless-stopped
    command: ["python", "-m", "backend.app.daemons.hash_broadcaster"]
    networks:
      - attilan_net
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db_core:
        condition: service_healthy
    volumes:
      - broadcaster_data:/var/lib/attilan
    environment:
      AUDIT_REPLICA_DATABASE_URL: postgresql://audit_replica_login:${AUDIT_REPLICA_PASSWORD:?set AUDIT_REPLICA_PASSWORD in .env}@db_core:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      AUDIT_BROADCAST_HMAC_KEY: ${AUDIT_BROADCAST_HMAC_KEY:?set AUDIT_BROADCAST_HMAC_KEY in .env}
      REMOTE_AUDIT_WEBHOOK_URL: ${REMOTE_AUDIT_WEBHOOK_URL:?set REMOTE_AUDIT_WEBHOOK_URL in .env}
      BROADCAST_INTERVAL_SECONDS: "300"
      CURSOR_FILE_PATH: /var/lib/attilan/broadcaster_cursor.json

  frontend_ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attilan_frontend_ui
    restart: unless-stopped
    networks:
      attilan_net:
        aliases:
          - frontend_ui
          - frontend-ui
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
      - /var/cache/nginx:uid=10001,gid=10001,mode=0700
      - /var/run:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]

  nginx_gateway:
    image: nginx:1.27-alpine
    container_name: attilan_nginx_gateway
    restart: unless-stopped
    networks:
      - attilan_net
    depends_on:
      - fastapi_engine
      - frontend_ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

networks:
  attilan_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  broadcaster_data:
