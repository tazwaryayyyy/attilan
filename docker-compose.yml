# Local stack. Secrets come from .env; no embedded postgres/API passwords.
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: attilan_postgres_local
    restart: unless-stopped
    networks:
      attilan_local_net:
        aliases:
          - postgres
          - db
    entrypoint: ["/bin/sh", "/postgres-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:?set DB_BOOTSTRAP_USER in .env}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?set DB_BOOTSTRAP_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      API_WORKER_PASSWORD: ${API_WORKER_PASSWORD:?set API_WORKER_PASSWORD in .env}
      AUDIT_REPLICA_PASSWORD: ${AUDIT_REPLICA_PASSWORD:?set AUDIT_REPLICA_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./database/schema_stage1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/postgres-entrypoint.sh:/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:3.8.1
    container_name: attilan_localstack
    restart: unless-stopped
    networks:
      attilan_local_net:
        aliases:
          - localstack
          - s3
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  localstack-init:
    image: amazon/aws-cli:2.17.61
    container_name: attilan_localstack_init
    restart: "no"
    networks:
      - attilan_local_net
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:?set MINIO_EVIDENCE_BUCKET in .env}
    entrypoint: >
      /bin/sh -c "
        set -e;
        aws --endpoint-url=http://localstack:4566 s3api create-bucket --bucket $$MINIO_EVIDENCE_BUCKET;
        aws --endpoint-url=http://localstack:4566 s3api put-object-lock-configuration
          --bucket $$MINIO_EVIDENCE_BUCKET
          --object-lock-configuration '{\"ObjectLockEnabled\":\"Enabled\"}';
        aws --endpoint-url=http://localstack:4566 s3api get-object-lock-configuration
          --bucket $$MINIO_EVIDENCE_BUCKET;
        echo 'WORM Object Lock successfully enforced on bucket $$MINIO_EVIDENCE_BUCKET';
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attilan_backend_local
    restart: unless-stopped
    networks:
      attilan_local_net:
        aliases:
          - backend
          - api
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://api_worker_login:${API_WORKER_PASSWORD:?set API_WORKER_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      MINIO_ENDPOINT: localstack:4566
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test
      MINIO_SECURE: "false"
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:?set MINIO_EVIDENCE_BUCKET in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attilan_frontend_local
    restart: unless-stopped
    networks:
      attilan_local_net:
        aliases:
          - frontend
    user: "10001:10001"
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
      - /var/cache/nginx:uid=10001,gid=10001,mode=0700
      - /var/run:uid=10001,gid=10001,mode=0700
    depends_on:
      - backend
    ports:
      - "3000:8080"

networks:
  attilan_local_net:
    driver: bridge

volumes:
  postgres_local_data:
    name: attilan_postgres_local_data
  localstack_data:
